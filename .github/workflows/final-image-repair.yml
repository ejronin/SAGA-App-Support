name: Final User Guide image repair

on:
  push:
    branches:
      - image-repair-final

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Restore original PNGs and apply privacy-safe edits
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT='86cf2b9e55bea9e135cc40fe64c3ed747e5a6415'
          DIR='assets/fusion_user_guide/publication_images'
          for name in \
            02_fusion_addins_toolbar \
            04_project_setup \
            06_parts_empty_catalog \
            20_project_saved_confirmation \
            21_check_project_ready \
            24_pdf_created_confirmation
          do
            git show "${SOURCE_COMMIT}:${DIR}/${name}.png" > "${DIR}/${name}.png"
            rm -f "${DIR}/${name}.webp"
          done

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter, ImageDraw, ImageFont

          d = Path('assets/fusion_user_guide/publication_images')

          # 02: keep the useful toolbar area only. No personal information is needed below it.
          p = d / '02_fusion_addins_toolbar.png'
          im = Image.open(p).convert('RGB').crop((0, 0, 620, 123))
          im.save(p, format='PNG')

          # 04: obscure the local project path while preserving the Browse control and layout.
          p = d / '04_project_setup.png'
          im = Image.open(p).convert('RGB')
          box = (20, 340, 611, 388)
          im.paste(im.crop(box).filter(ImageFilter.GaussianBlur(14)), box)
          im.save(p, format='PNG')

          # 06: obscure the project-name strip; the Parts controls remain untouched.
          p = d / '06_parts_empty_catalog.png'
          im = Image.open(p).convert('RGB')
          box = (8, 18, 250, 45)
          im.paste(im.crop(box).filter(ImageFilter.GaussianBlur(12)), box)
          im.save(p, format='PNG')

          # 20: obscure the project identity strip and local project path only.
          p = d / '20_project_saved_confirmation.png'
          im = Image.open(p).convert('RGB')
          for box in ((0, 0, 460, 50), (20, 386, 620, 435)):
              im.paste(im.crop(box).filter(ImageFilter.GaussianBlur(14)), box)
          im.save(p, format='PNG')

          # 21: this crop removes the old owner-build label and local Windows path completely.
          p = d / '21_check_project_ready.png'
          im = Image.open(p).convert('RGB').crop((20, 88, 590, 392))
          im.save(p, format='PNG')

          # 24: replace the output-path area with a generic successful result.
          p = d / '24_pdf_created_confirmation.png'
          im = Image.open(p).convert('RGB')
          draw = ImageDraw.Draw(im)
          draw.rectangle((24, 368, 695, 432), fill=(13, 55, 34))
          try:
              font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 14)
          except OSError:
              font = ImageFont.load_default()
          draw.text((31, 379), 'PDF created', fill=(33, 180, 91), font=font)
          draw.text((31, 398), 'guide.pdf', fill=(33, 180, 91), font=font)
          im.save(p, format='PNG')
          PY

      - name: Restore PNG references and validate documentation assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image

          guide = Path('user-guide.md')
          text = guide.read_text(encoding='utf-8')
          for name in (
              '02_fusion_addins_toolbar',
              '04_project_setup',
              '06_parts_empty_catalog',
              '20_project_saved_confirmation',
              '21_check_project_ready',
              '24_pdf_created_confirmation',
          ):
              text = text.replace(f'{name}.webp', f'{name}.png')
          guide.write_text(text, encoding='utf-8')

          pages = [Path('user-guide.md'), Path('quick-start.md')]
          refs = []
          for page in pages:
              body = page.read_text(encoding='utf-8')
              refs.extend((page, ref) for ref in re.findall(r'<img\s+[^>]*src="([^"]+)"', body))

          missing = [(str(page), ref) for page, ref in refs if not Path(ref).is_file()]
          if missing:
              raise SystemExit('Missing image references: ' + repr(missing))

          checked = set()
          for _, ref in refs:
              p = Path(ref)
              if p in checked:
                  continue
              checked.add(p)
              with p.open('rb') as f:
                  sig = f.read(8)
              if p.suffix.lower() == '.png' and sig != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'Invalid PNG signature: {p}')
              with Image.open(p) as im:
                  im.verify()

          # Verify ordinary local file/download links on these two pages as well.
          link_re = re.compile(r'\[[^\]]+\]\(([^)#]+)(?:#[^)]+)?\)')
          broken = []
          for page in pages:
              body = page.read_text(encoding='utf-8')
              for href in link_re.findall(body):
                  if '://' in href or href.startswith('mailto:'):
                      continue
                  target = (page.parent / href)
                  if target.suffix == '.md' and not target.exists():
                      broken.append((str(page), href))
                  elif href.startswith('assets/') and not target.exists():
                      broken.append((str(page), href))
          if broken:
              raise SystemExit('Broken local links: ' + repr(broken))

          print(f'Validated {len(refs)} image references across User Guide and Quick Start; all decode successfully.')
          PY

      - name: Build repair preview artifact
        run: |
          mkdir -p repair-preview
          cp assets/fusion_user_guide/publication_images/{02_fusion_addins_toolbar,04_project_setup,06_parts_empty_catalog,20_project_saved_confirmation,21_check_project_ready,24_pdf_created_confirmation}.png repair-preview/

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: final-image-repair-preview
          path: repair-preview
          if-no-files-found: error

      - name: Commit repair on review branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/final-image-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore privacy-safe User Guide PNG screenshots'
          git push origin HEAD:image-repair-final
