name: Fix User Guide image extensions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rename WebP image data to WebP files
        run: |
          set -euo pipefail
          cd assets/fusion_user_guide/publication_images
          for name in \
            02_fusion_addins_toolbar \
            04_project_setup \
            20_project_saved_confirmation \
            21_check_project_ready \
            24_pdf_created_confirmation
          do
            file "${name}.png"
            mv "${name}.png" "${name}.webp"
          done

      - name: Update User Guide image references
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('user-guide.md')
          text = p.read_text(encoding='utf-8')
          names = [
              '02_fusion_addins_toolbar',
              '04_project_setup',
              '20_project_saved_confirmation',
              '21_check_project_ready',
              '24_pdf_created_confirmation',
          ]
          for name in names:
              text = text.replace(f'{name}.png', f'{name}.webp')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fusion_user_guide/publication_images user-guide.md
          git commit -m "Repair User Guide image files"
          git push
