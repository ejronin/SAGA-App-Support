name: Run User Guide image repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair mislabeled image files
        shell: bash
        run: |
          set -euo pipefail
          cd assets/fusion_user_guide/publication_images
          : > /tmp/moved_images.txt

          for name in \
            02_fusion_addins_toolbar \
            04_project_setup \
            20_project_saved_confirmation \
            21_check_project_ready \
            24_pdf_created_confirmation
          do
            source_file="${name}.png"
            target_file="${name}.webp"

            if [ ! -f "$source_file" ]; then
              echo "Missing expected file: $source_file" >&2
              exit 1
            fi

            description="$(file -b "$source_file")"
            echo "$source_file: $description"

            if printf '%s' "$description" | grep -qiE 'Web/P|WebP'; then
              mv "$source_file" "$target_file"
              printf '%s\n' "$name" >> /tmp/moved_images.txt
            elif printf '%s' "$description" | grep -qi 'PNG image data'; then
              echo "$source_file is already a valid PNG; leaving it unchanged."
            else
              echo "$source_file is neither a valid PNG nor recognizable WebP data." >&2
              exit 1
            fi
          done

      - name: Update User Guide references for renamed files
        run: |
          python - <<'PY'
          from pathlib import Path

          moved = [line.strip() for line in Path('/tmp/moved_images.txt').read_text().splitlines() if line.strip()]
          p = Path('user-guide.md')
          text = p.read_text(encoding='utf-8')
          for name in moved:
              text = text.replace(f'{name}.png', f'{name}.webp')
          p.write_text(text, encoding='utf-8')
          print('Renamed:', ', '.join(moved) if moved else 'none')
          PY

      - name: Validate every User Guide image target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          guide = Path('user-guide.md').read_text(encoding='utf-8')
          refs = re.findall(r'<img\s+[^>]*src="([^"]+)"', guide)
          missing = [ref for ref in refs if not Path(ref).is_file()]
          if missing:
              raise SystemExit('Missing image targets: ' + ', '.join(missing))
          print(f'All {len(refs)} User Guide image targets exist.')
          PY

          while IFS= read -r -d '' image; do
            description="$(file -b "$image")"
            case "$image" in
              *.png)
                printf '%s' "$description" | grep -qi 'PNG image data' || { echo "Invalid PNG: $image ($description)" >&2; exit 1; }
                ;;
              *.webp)
                printf '%s' "$description" | grep -qiE 'Web/P|WebP' || { echo "Invalid WebP: $image ($description)" >&2; exit 1; }
                ;;
            esac
          done < <(find assets/fusion_user_guide/publication_images -type f \( -name '*.png' -o -name '*.webp' \) -print0)

      - name: Remove one-time repair workflows
        run: |
          rm -f .github/workflows/fix-user-guide-image-extensions.yml
          rm -f .github/workflows/run-user-guide-image-repair.yml

      - name: Commit repaired images
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes were needed.'
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair User Guide image files"
          git push
