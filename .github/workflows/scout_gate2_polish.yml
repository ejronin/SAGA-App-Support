name: Scout Gate 2 Actual Blend Production Polish

on:
  push:
    branches:
      - codex/scout-gate2-production-polish-20260823
    paths:
      - '.gate2_trigger_actual'

concurrency:
  group: scout-gate2-actual-blend
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout isolated Gate 2 branch
        uses: actions/checkout@v4

      - name: Publish active run locator
        shell: bash
        run: |
          printf 'run_id=%s\nstatus=running\nsource_sha=%s\ninput_sha256=eb4237027d0db43780ca5ae91bb7f935cf5f6a6badd3f2356a253b7570be13f7\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > .gate2_temp/run_info_actual.txt
          git config user.name 'Gate 2 Runtime'
          git config user.email 'actions@users.noreply.github.com'
          git add .gate2_temp/run_info_actual.txt
          git commit -m "Record active actual-blend Gate 2 runtime $GITHUB_RUN_ID" || true
          git push origin HEAD:codex/scout-gate2-production-polish-20260823

      - name: Reassemble bounded polish script
        shell: bash
        run: |
          cat .gate2_temp/polish.part00 .gate2_temp/polish.part01 .gate2_temp/polish.part02 .gate2_temp/polish.part03_v2 > gate2_production_polish.py
          python -m py_compile gate2_production_polish.py

      - name: Reassemble and verify authoritative uploaded blend
        shell: bash
        run: |
          cat .gate2_actual/blend.b64.part* | tr -d '\n\r' | base64 -d > SAGA_Demo_Workshop_Scout_Robot_FINAL.blend
          printf '%s  %s\n' 'eb4237027d0db43780ca5ae91bb7f935cf5f6a6badd3f2356a253b7570be13f7' 'SAGA_Demo_Workshop_Scout_Robot_FINAL.blend' | sha256sum -c -
          stat -c '%n %s bytes' SAGA_Demo_Workshop_Scout_Robot_FINAL.blend

      - name: Install headless display support
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Download official Blender 5.2.0 LTS
        shell: bash
        run: |
          curl -fL --retry 5 --retry-delay 5 \
            https://download.blender.org/release/Blender5.2/blender-5.2.0-linux-x64.tar.xz \
            -o blender.tar.xz
          tar -xf blender.tar.xz
          BLENDER="$(pwd)/blender-5.2.0-linux-x64/blender"
          "$BLENDER" --version | head -5
          echo "BLENDER=$BLENDER" >> "$GITHUB_ENV"

      - name: Runtime Gate 1 inventory, Gate 2 polish, and Gate 3 QA
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p Final
          xvfb-run -a "$BLENDER" "$(pwd)/SAGA_Demo_Workshop_Scout_Robot_FINAL.blend" \
            --background --python-exit-code 20 \
            --python gate2_production_polish.py -- \
            --output-dir "$(pwd)/Final/SAGA_Workshop_Scout_Production_Polish_Output" \
            --static-audit "$(pwd)/.gate2_temp/SCOUT_POLISH_AUDIT.md" \
            | tee gate2_actual.log
          grep -q 'SAGA_GATE2_PRODUCTION_POLISH=PASS' gate2_actual.log

      - name: Verify required deliverables
        shell: bash
        run: |
          ROOT=Final/SAGA_Workshop_Scout_Production_Polish_Output
          test -f "$ROOT/SAGA_Demo_Workshop_Scout_Robot_PRODUCTION_POLISH.blend"
          test -f "$ROOT/SCOUT_POLISH_AUDIT.md"
          test -f "$ROOT/SCOUT_POLISH_CHANGELOG.md"
          test -f "$ROOT/SCOUT_OBJECT_NAME_MAP.csv"
          test -f "$ROOT/SCOUT_FUNCTIONAL_QA.md"
          test -f "$ROOT/MANIFEST.sha256"
          test "$(find "$ROOT/Review_Images" -maxdepth 1 -name '*.png' | wc -l)" -eq 10
          test "$(find "$ROOT/Region_Reviews" -maxdepth 1 -name '*.png' | wc -l)" -eq 7
          test "$(find "$ROOT/Checkpoints" -maxdepth 1 -name '*.blend' | wc -l)" -eq 7
          sha256sum "$ROOT/SAGA_Demo_Workshop_Scout_Robot_PRODUCTION_POLISH.blend"
          sha256sum Final/SAGA_Workshop_Scout_Production_Polish_Output.zip

      - name: Upload production-polish handoff
        uses: actions/upload-artifact@v4
        with:
          name: SAGA_Workshop_Scout_ActualBlend_Production_Polish_Output
          path: |
            Final/SAGA_Workshop_Scout_Production_Polish_Output
            Final/SAGA_Workshop_Scout_Production_Polish_Output.zip
            gate2_actual.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish final run locator
        if: always()
        shell: bash
        run: |
          printf 'run_id=%s\nstatus=%s\nsource_sha=%s\ninput_sha256=eb4237027d0db43780ca5ae91bb7f935cf5f6a6badd3f2356a253b7570be13f7\n' "$GITHUB_RUN_ID" "${{ job.status }}" "$GITHUB_SHA" > .gate2_temp/run_info_actual.txt
          git add .gate2_temp/run_info_actual.txt
          git commit -m "Record actual-blend Gate 2 runtime $GITHUB_RUN_ID (${{ job.status }})" || exit 0
          git push origin HEAD:codex/scout-gate2-production-polish-20260823
